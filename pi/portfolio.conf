server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;

    # The site is one large self-contained file; compressing it on the origin
    # keeps the Pi's upstream (residential cable) from carrying 447KB per hit.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Public health snapshot, written once a minute by pi-status.service.
    #
    # max-age=30 lets Cloudflare absorb the header strip's polling, so visitor
    # count stops translating into origin hits. Serving a cached copy stays
    # honest because the page trusts the "generated" field inside the JSON, not
    # the fact that the request succeeded -- a stale edge copy still renders as
    # stale.
    #
    # add_header inside a location discards every add_header inherited from the
    # server block. The two security headers below are therefore repeated
    # deliberately; deleting them here silently drops them for this path, and
    # losing nosniff on JSON re-enables MIME sniffing on a response the page
    # parses.
    location = /status.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=30" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
